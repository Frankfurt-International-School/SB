<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My PE Profile · Grade 8</title>
<!--
  G8 PE Profile — student page (GitHub Pages). Built from src/ by dev/build-site.js.
  Holds no data: it signs the student in with Google and asks the FIS Apps Script
  API for that student's own rows. See PRIVACY.md.
-->
<style>
/* Visual system from design/My_PE_Profile_mockup.html (profile, light) and
   design/G8_Build_Your_Card.html (card, dark). FIS maroon + gold, Archivo + Inter
   with a system fallback unless Config web_fonts = TRUE. */
:root{
  --maroon:#6f1d2c;--maroon-t:#f3e6e8;--gold:#e7b64b;
  --fit:#e8730c;--fit-t:#fdecdc;--fund:#0e8f86;--fund-t:#d9f2f0;--skill:#2f6df0;--skill-t:#e8f0fe;
  --ap:#1f9d57;--ap-t:#e6f6ec;--rep:#8a3bb0;--rep-t:#f3e8fa;
  --ink:#161213;--ink-soft:#463c3e;--muted:#7a6f71;--paper:#f7f4f2;--card:#fff;--line:#e7e0df;
  --disp:"Archivo","Barlow Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* card skin — set by the chosen PE Style */
  --ink1:#7d2233;--ink2:#6f1d2c;--ink3:#4a1019;--acc:#e7b64b;--accs:#f3d689;--rib:#3a1008;
  --frame:linear-gradient(145deg,#e0a566,#a15c2b 50%,#7a441f 62%,#d68a4e); /* bronze */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body.dark{background:radial-gradient(circle at 50% 0%,#2a2024,#120d0e);color:#fff}
button{font:inherit}
.wrap{max-width:940px;margin:0 auto;padding:24px 16px 60px}

/* loading / toast */
.loading{display:flex;align-items:center;gap:12px;justify-content:center;padding:80px 0;color:var(--muted);font-size:14px}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--maroon);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#ffd9d9;color:#7a1414}

/* ── profile view (light) ───────────────────────────────────────── */
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.demo-tag{display:inline-block;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.yearlab{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--maroon)}
.cardteaser{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--ink1),var(--ink2) 55%,var(--ink3));border:1px solid #c9982f;border-radius:16px;padding:13px 18px;margin:6px 0 10px;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.28),0 0 18px rgba(231,182,75,.4);flex-wrap:wrap;transition:background .3s}
.cardteaser::after{content:"";position:absolute;top:-60%;left:-70%;width:45%;height:220%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.28),transparent);transform:rotate(9deg);animation:sweep 4.2s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{left:-70%}62%,100%{left:150%}}
@media(prefers-reduced-motion:reduce){.cardteaser::after,.card,.cinner::after{animation:none}}
.ct-av{width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);flex:none;position:relative;z-index:2;background:rgba(0,0,0,.25);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:20px;color:var(--accs)}
.ct-av img{width:100%;height:100%;object-fit:cover;display:block}
.ct-id{position:relative;z-index:2;min-width:150px;flex:1}
.ct-name{font-family:var(--disp);font-weight:700;font-size:22px;color:#fff;line-height:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ct-tier{font-family:var(--disp);font-size:11px;font-weight:700;color:var(--rib);background:var(--frame);padding:2px 8px;border-radius:20px}
.ct-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.ct-arch{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--accs);margin-top:3px}
.ct-stats{display:flex;gap:16px;position:relative;z-index:2;margin-left:6px}
.ct-stats div{text-align:center}.ct-stats b{font-family:var(--disp);font-size:18px;color:#fff;display:block;line-height:1}
.ct-stats span{font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.04em}
.ct-btn{margin-left:auto;position:relative;z-index:2;background:linear-gradient(145deg,#f3d689,#c9982f);color:#3a1008;font-family:var(--disp);font-weight:700;font-size:14px;text-decoration:none;padding:9px 16px;border-radius:10px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.25);border:none;cursor:pointer}
.ct-btn:hover{filter:brightness(1.06)}
.ct-btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 8px rgba(0,0,0,.25)}50%{box-shadow:0 3px 8px rgba(0,0,0,.25),0 0 0 6px rgba(231,182,75,.25)}}
.goals{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 8px}
.goals .hd{font-family:var(--disp);font-weight:600;font-size:17px;margin:0 0 6px}
.goals .empty{font-size:12.5px;color:var(--muted)}
h3.sec{font-family:var(--disp);font-weight:600;font-size:22px;margin:30px 0 3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3.sec .em{font-size:16px;width:31px;height:31px;border-radius:9px;display:inline-grid;place-items:center;background:var(--maroon-t)}
.seclede{font-size:12.5px;color:var(--muted);margin:0 0 13px}
.tap{font-size:10.5px;font-weight:600;font-family:var(--disp);color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.grid3,.grid4{grid-template-columns:1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px 14px;cursor:pointer;transition:.15s;position:relative;text-align:left;width:100%;color:var(--ink)}
.tile:hover{box-shadow:0 5px 16px rgba(0,0,0,.08);transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.tile .tnrow{display:flex;align-items:center;gap:6px}.tile .em{font-size:15px}.tile .tn{font-weight:600;font-size:13px}
.tile .tsub{font-size:11px;color:var(--muted);margin:1px 0 10px;min-height:13px}
.tile .plus{position:absolute;top:11px;right:12px;color:#c9c1c0;font-size:14px;line-height:1}
.track{display:flex;gap:4px}.track i{height:9px;border-radius:3px;flex:1;background:#ece7e6}
.tracklab{font-family:var(--disp);font-size:12px;font-weight:600;margin-top:6px;color:var(--muted)}
.rung{font-family:var(--disp);font-size:11px;color:var(--muted);margin-top:5px}
.measure{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1;color:#c9c1c0}.measure small{font-size:11px;color:var(--muted);font-weight:400}
.a-fit .track i.on{background:var(--fit)}.a-fund .track i.on{background:var(--fund)}.a-skill .track i.on{background:var(--skill)}.a-ap .track i.on{background:var(--ap)}
.fhero{background:var(--fit-t);border:1.5px solid var(--fit);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:13px;margin-bottom:12px;transition:.15s;width:100%;text-align:left;color:var(--ink)}
.fhero:hover{box-shadow:0 5px 16px rgba(232,115,12,.15)}
.fhero .fx{font-size:22px;flex:none}.fhero .fm{flex:1}.fhero .fm .n{font-weight:600;font-size:15px}.fhero .fm .s{font-size:12px;color:var(--ink-soft)}
.fhero .fv{font-family:var(--disp);font-weight:700;font-size:24px;color:var(--fit);text-align:right;line-height:1}.fhero .fv span{font-size:11px;color:var(--muted);font-weight:400;display:block}
.band{background:var(--ink);border-radius:14px;padding:15px 16px;cursor:pointer;color:#fff;transition:.15s;position:relative;text-align:left;width:100%;border:none}
.band:hover{box-shadow:0 6px 18px rgba(0,0,0,.18);transform:translateY(-1px)}
.band .bn{font-family:var(--disp);font-weight:700;font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.band .btrack{display:flex;gap:3px;margin-bottom:6px}.band .btrack i{height:7px;flex:1;border-radius:2px;background:#4a3b3e}.band .btrack i.on{background:#d7a6ec}
.band .blab{font-family:var(--disp);font-size:12px;color:#bfb0c4;font-weight:600}.band .plus{position:absolute;top:13px;right:14px;color:#9a8aa0;font-size:15px}
.foot{margin-top:22px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 18px;font-size:13px;color:var(--ink-soft);display:flex;gap:11px;align-items:center}.foot b{color:var(--maroon)}
.foot .arrow{font-family:var(--disp);font-size:24px;color:var(--maroon)}
.sec-glance,.sec-refl{color:var(--maroon)}.sec-fit{color:var(--fit)}.sec-fit .em{background:var(--fit-t)}.sec-fund{color:var(--fund)}.sec-fund .em{background:var(--fund-t)}.sec-skill{color:var(--skill)}.sec-skill .em{background:var(--skill-t)}.sec-ap{color:var(--ap)}.sec-ap .em{background:var(--ap-t)}.sec-rep{color:var(--rep)}.sec-rep .em{background:var(--rep-t)}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(22,18,19,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.ov.show{display:flex}
.ovcard{background:var(--card);color:var(--ink);border-radius:18px;max-width:470px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .16s ease;max-height:90vh;overflow:auto}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
.ovcard .x{float:right;border:none;background:#f0eae9;width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer;color:var(--ink-soft)}
.ovcard h4{font-family:var(--disp);font-weight:700;font-size:22px;margin:2px 0 2px;display:flex;align-items:center;gap:7px}.ovcard .om{font-size:12.5px;color:var(--muted);margin:0 0 15px}
.ovnow{background:var(--maroon-t);border-left:3px solid var(--maroon);border-radius:0 9px 9px 0;padding:11px 14px;margin-bottom:9px}
.ovnow .l{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--maroon);letter-spacing:.04em;margin-bottom:3px}.ovnow .t{font-size:13.5px;color:var(--ink);line-height:1.5}
.ovnext{border:1px dashed var(--line);border-radius:9px;padding:11px 14px}.ovnext .l{font-family:var(--disp);font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em;margin-bottom:3px}.ovnext .t{font-size:13px;color:var(--ink-soft);line-height:1.5}
.lad{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:6px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:9px;align-items:flex-start}
.lad .lv{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--muted);flex:none;width:20px}
.ovfeeds{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.ovfeeds b{color:var(--ink-soft)}

/* ── card view (dark) ───────────────────────────────────────────── */
.back{display:inline-flex;align-items:center;gap:6px;color:#c8bcbe;text-decoration:none;font-size:13px;background:none;border:1px solid #3a2e31;border-radius:999px;padding:6px 14px;cursor:pointer}
.back:hover{border-color:#5a4a4e;color:#fff}
.hero{text-align:center;margin:10px 0 22px}
.hero .k{font-family:var(--disp);font-weight:700;letter-spacing:.22em;font-size:13px;color:var(--gold)}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5vw,52px);margin:6px 0 4px;letter-spacing:-.01em}
.hero p{color:#c8bcbe;font-size:14px;margin:0}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.step{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.step .saved{font-size:11px;letter-spacing:.04em;color:#7fe0a8;text-transform:none;font-weight:600}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:420px){.styles{grid-template-columns:1fr}}
.sbtn{background:#241d20;border:1.5px solid #3a2e31;border-radius:14px;padding:15px 14px;cursor:pointer;transition:.15s;text-align:left;color:#fff;width:100%}
.sbtn:hover{border-color:#5a4a4e;transform:translateY(-1px)}
.sbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sbtn.sel{border-color:var(--acc);background:#2e2528;box-shadow:0 6px 18px rgba(231,182,75,.2)}
.sbtn[disabled]{opacity:.6;cursor:progress}
.sbtn .se{font-size:24px}.sbtn .sn{font-family:var(--disp);font-weight:700;font-size:16px;margin:5px 0 2px}
.sbtn .sd{font-size:11.5px;color:#c8bcbe;line-height:1.35}
.cardstage{display:flex;flex-direction:column;align-items:center;gap:14px;position:sticky;top:18px}
.card{width:min(360px,100%);border-radius:24px;padding:4px;background:var(--frame);box-shadow:0 26px 64px rgba(0,0,0,.55),0 0 30px rgba(231,182,75,.35);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-8px) rotate(.4deg)}}
.cinner{background:linear-gradient(160deg,var(--ink1),var(--ink2) 42%,var(--ink3));border-radius:20px;padding:17px 19px;position:relative;overflow:hidden;transition:.3s}
.cinner::after{content:"";position:absolute;top:-60%;left:-75%;width:55%;height:220%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.42),transparent);transform:rotate(9deg);animation:sweep 4.2s ease-in-out infinite;pointer-events:none}
.chd{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:700;font-size:11px;color:var(--acc);position:relative;z-index:2}
.ctier{font-family:var(--disp);font-weight:700;font-size:10px;color:var(--rib);background:var(--frame);padding:2px 9px;border-radius:20px}
.cwho{display:flex;align-items:center;gap:10px;margin-top:10px;position:relative;z-index:2}
.cav{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--acc);background:rgba(0,0,0,.25);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--accs);flex:none}
.cav img{width:100%;height:100%;object-fit:cover;display:block}
.cname{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;word-break:break-word;color:#fff}
.cclass{font-size:11px;color:rgba(255,255,255,.72);margin-top:2px}
.crib{background:linear-gradient(90deg,var(--acc),var(--accs));border-radius:9px;padding:6px 13px;font-family:var(--disp);font-weight:700;color:var(--rib);margin:11px 0;display:flex;justify-content:space-between;align-items:center;font-size:18px;position:relative;z-index:2}
.crad{position:relative;z-index:2;margin:2px 0}
.rlabel{font-family:var(--disp);font-size:9px;fill:rgba(255,255,255,.82);font-weight:600}
.rnote{font-family:var(--body);font-size:10px;fill:rgba(255,255,255,.6)}
.cstat{display:flex;gap:7px;margin-top:6px;position:relative;z-index:2}
.cstat div{flex:1;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px;text-align:center}
.cstat b{font-family:var(--disp);font-size:18px;display:block;color:#fff}.cstat span{font-size:8px;color:rgba(255,255,255,.72);text-transform:uppercase;letter-spacing:.05em}
.cbadge{display:flex;gap:9px;justify-content:center;margin-top:11px;position:relative;z-index:2}
.cbadge span{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3d6,var(--acc) 62%,#b9871f);display:grid;place-items:center;font-size:15px;opacity:.45;filter:grayscale(.4)}
.cfoot{margin-top:11px;text-align:center;font-family:var(--disp);font-weight:600;font-size:11px;color:var(--acc);position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.18);padding-top:8px}
.cardhint{font-size:12px;color:#c8bcbe;text-align:center;max-width:34ch;line-height:1.45}
.done{margin-top:34px;text-align:center}
.done .ct-btn{margin:0}

/* ── Lesson 1: strengths & challenges ───────────────────────────── */
.goals.l1 .l1btn{display:inline-block;margin:12px 0 2px}
.l1row{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}.l1row:first-of-type{border-top:none}
.l1row b{font-family:var(--disp);font-size:12px;flex:none;width:96px;padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--paper);border:1px solid var(--line)}
.chip.g{background:#e6f6ec;border-color:#bfe6cd}.chip.r{background:#fde8e8;border-color:#f3c2c2}.chip.none{color:var(--muted)}
.l1acts{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.lnk{background:none;border:none;color:var(--maroon);font-weight:600;font-size:13px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.back.light{color:var(--ink-soft);border-color:var(--line);background:#fff}.back.light:hover{color:var(--ink)}
.phero{margin:14px 0 4px}.phero .k,.sumhero .k{font-family:var(--disp);font-weight:700;letter-spacing:.18em;font-size:12px;color:var(--maroon)}
.phero h1,.sumhero h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,4.5vw,40px);margin:4px 0 6px;line-height:1.05}
.phero p,.sumhero p{color:var(--ink-soft);font-size:14px;max-width:60ch;margin:0 0 10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);font-family:var(--disp);font-weight:600}.legend .sep{color:var(--muted)}
.predict{padding-bottom:110px}
.pitem{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;transition:.15s}
.pitem.a-fit{border-left-color:var(--fit)}.pitem.a-fund{border-left-color:var(--fund)}
.pitem.done{background:#fbfaf9}.pitem .tick{margin-left:auto;font-family:var(--disp);font-weight:700;color:var(--ap);opacity:0;transition:.15s}.pitem.done .tick{opacity:1}
.pihead{display:flex;align-items:center;gap:10px;margin-bottom:9px}.pihead .em{font-size:22px}.pt{font-weight:600;font-size:14.5px}.ps{font-size:11.5px;color:var(--muted)}
.tls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.tl{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;font-family:var(--disp);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px}
.tl span{font-size:15px}
.tl.strength.on{background:#e6f6ec;border-color:#1f9d57;color:#0f7a41}.tl.neutral.on{background:#fff6dc;border-color:#e0a100;color:#7a5600}.tl.work-on.on{background:#fde8e8;border-color:#d64545;color:#8f1f1f}
.tl:focus-visible,.fq:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.fqs{display:flex;gap:6px;flex-wrap:wrap}
.fq{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
.fq.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:16px;z-index:40;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.pbar .pcount{flex:1;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink-soft)}.pbar .pcount b{font-size:20px;color:var(--ink)}
.ptrack{height:6px;border-radius:3px;background:#ece7e6;margin-top:5px;max-width:320px}.ptrack i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--fit),var(--fund));transition:width .2s}
.pbar .ct-btn{margin:0}.pbar .ct-btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.sumhero{margin:20px 0 16px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.sumgrid{grid-template-columns:1fr}}
.sumcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;border-top:4px solid var(--line)}
.sumcard.g{border-top-color:#1f9d57}.sumcard.r{border-top-color:#d64545}
.sumcard h3{font-family:var(--disp);font-weight:700;font-size:17px;margin:0 0 8px}
.slist{list-style:none;margin:0;padding:0}.slist li{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}.slist li:first-child{border-top:none}
.slist .em{font-size:18px}.slist .sf{margin-left:auto;font-size:11.5px;color:var(--muted)}
.sumcard .empty{font-size:13px;color:var(--muted);margin:0}
.sumnote{margin-top:14px;background:var(--maroon-t);border-left:3px solid var(--maroon);border-radius:0 12px 12px 0;padding:12px 16px;font-size:13px;color:var(--ink-soft)}.sumnote b{color:var(--maroon)}
.sumacts{display:flex;gap:18px;align-items:center;margin-top:18px;flex-wrap:wrap}.sumacts .ct-btn{margin:0}
.chead,.crowi{display:grid;grid-template-columns:28px 1fr 150px;gap:10px;align-items:center}
.chead{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:6px 14px;grid-template-columns:1fr 1fr 150px}
.chead span:first-child{display:none}
.crowi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:9px 14px;margin-bottom:6px}
.crowi.a-fit{border-left-color:var(--fit)}.crowi.a-fund{border-left-color:var(--fund)}
.crowi .em{font-size:18px}.crowi .ct b{display:block;font-size:13.5px}.crowi .ct span{font-size:12px;color:var(--ink-soft)}
.crowi .cv{font-family:var(--disp);font-weight:700;text-align:right}.pending{font-size:11.5px;color:var(--muted);font-weight:500}
@media(max-width:520px){.chead,.crowi{grid-template-columns:28px 1fr}.chead{grid-template-columns:1fr}.chead span:last-child{display:none}.crowi .cv{grid-column:2;text-align:left}}

/* ── sign-in ─────────────────────────────────────────────────────── */
.signin{max-width:440px;margin:12vh auto 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 28px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.08)}
.signin .k{font-family:var(--disp);font-weight:700;letter-spacing:.22em;font-size:12px;color:var(--maroon)}
.signin h1{font-family:var(--disp);font-weight:800;font-size:34px;margin:6px 0 8px;line-height:1}
.signin p{color:var(--ink-soft);font-size:14.5px;margin:0 0 16px}
.signin .note{background:var(--maroon-t);border-left:3px solid var(--maroon);border-radius:0 9px 9px 0;padding:9px 12px;font-size:13px;text-align:left}
.gbtn{display:flex;justify-content:center;min-height:44px;margin:6px 0 14px}
.signin .small{margin:0;font-size:11.5px}

/* ── messages for non-student states ────────────────────────────── */
.msg{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 28px;text-align:center}
.msg .big{font-size:38px}
.msg h2{font-family:var(--disp);font-weight:800;font-size:24px;margin:8px 0 6px}
.msg p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 8px}
.msg code{background:var(--paper);padding:2px 7px;border-radius:6px;font-size:13px;color:var(--ink)}
.msg .btn{display:inline-block;margin-top:10px;background:linear-gradient(145deg,#f3d689,#c9982f);color:#3a1008;border:none;font-family:var(--disp);font-weight:700;font-size:14px;padding:10px 20px;border-radius:11px;cursor:pointer;text-decoration:none}
.small{font-size:11.5px;color:var(--muted);text-align:center;margin-top:30px;line-height:1.5}

/* ── v3: results / goals / plan / teacher ── */
.planstrip{background:linear-gradient(135deg,var(--maroon),#8a2435);border-radius:15px;padding:13px 15px;margin:14px 0 4px;color:#fff;box-shadow:0 4px 14px rgba(111,29,44,.22)}
.planstrip .ps-h{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.02em;margin-bottom:9px}
.planstrip .ps-row{display:flex;gap:8px;flex-wrap:wrap}
.ps-btn{flex:1 1 auto;min-width:0;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 12px;font-family:var(--disp);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
.ps-btn:hover{background:rgba(255,255,255,.24)}
.ps-btn.primary{background:linear-gradient(145deg,#f3d689,#c9982f);color:#3a1008;border-color:transparent}
.goalchips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0 2px}
.goalchips .gc-h{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--maroon)}
.gchip{background:var(--gold);color:#3a1008;font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px}
.dlt{font-family:var(--disp);font-weight:700;font-size:12px;margin-left:7px;vertical-align:middle}
.dlt.up{color:var(--ap)}.dlt.down{color:#c0392b}
.tile.has .measure{color:var(--ink)}
.lbar{display:flex;gap:3px;margin:8px 0 2px}
.lbar i{height:7px;flex:1;border-radius:2px;background:var(--line);position:relative}
.lbar i.on{background:var(--fund)}
.lbar i.band:after{content:"";position:absolute;inset:-3px -1px;border:1.5px dashed var(--gold);border-radius:3px}
.tile.a-fund.below .lbar i.on{background:#c0392b}.tile.a-fund.meet .lbar i.on{background:var(--fit)}.tile.a-fund.ok .lbar i.on{background:var(--ap)}
.btrack.ap{display:flex;gap:3px;margin:8px 0 6px}.btrack.ap i{height:7px;flex:1;border-radius:2px;background:var(--line)}.btrack.ap i.on{background:var(--ap)}
.tile.a-ap.below .btrack.ap i.on{background:#c0392b}.tile.a-ap.meet .btrack.ap i.on{background:var(--fit)}
.band.ok .btrack i.on{background:#7fe0a6}.band.meet .btrack i.on{background:#f3c07a}.band.below .btrack i.on{background:#f0a097}
/* overlay trend */
.ovtrend{display:flex;gap:8px;margin-top:10px}
.ovtrend .ovt{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.ovtrend .ovt span{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.ovtrend .ovt b{font-family:var(--disp);font-size:20px;color:var(--ink)}
.lad.here{border-color:var(--fund);background:var(--fund-t)}
.lad .youre{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:10px;color:var(--fund);align-self:center;white-space:nowrap}
/* entry + goals + plan forms */
.phero.tight{margin:8px 0 2px}
.cpick{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:13px;color:var(--ink-soft);margin-top:4px}
.cpick select,.lvsel,.daysin{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
.enform{display:flex;flex-direction:column;gap:7px;margin:8px 0 80px}
.enrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px}
.enrow .en-n{font-family:var(--disp);font-weight:700;font-size:14px}
.enrow .en-in{display:flex;align-items:center;gap:8px}
.enrow .en-in small{color:var(--muted);font-size:11px;white-space:nowrap}
.enrow input[type=number]{width:78px;font-family:var(--disp);font-weight:700;font-size:17px;text-align:right;border:1px solid var(--line);border-radius:9px;padding:7px 9px;color:var(--ink)}
.enrow .en-mile{gap:5px}
.enrow .en-mile input[type=number]{width:50px;text-align:center}
.enrow .en-mile b{font-family:var(--disp);font-weight:800;color:var(--muted);font-size:17px}
.enrow input:focus,.goalrow input:focus,textarea:focus,select:focus{outline:2px solid var(--maroon);outline-offset:1px}
.goalrow{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.goalrow .gr-n{font-family:var(--disp);font-weight:700;font-size:14px}
.goalrow input{width:100%;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink)}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.fchip{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:8px 13px;font-family:var(--disp);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-soft)}
.fchip.on{background:var(--fit-t);border-color:var(--fit);color:var(--fit)}
textarea{width:100%;font-family:var(--body);font-size:14px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--ink);resize:vertical;margin-top:4px}
.daysin{width:80px;margin-top:4px}
/* teacher table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:10px}
.tablewrap table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.tablewrap th{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tablewrap th.num,.tablewrap td.num{text-align:center}
.tablewrap td{padding:9px 12px;border-bottom:1px solid var(--line)}
.tablewrap tbody tr:last-child td{border-bottom:none}
.tablewrap td.name{font-weight:600}.tablewrap td.sec{color:var(--muted);font-size:12px}
.tablewrap .muted{color:#c9c1c0}
.pill{display:inline-grid;place-items:center;min-width:26px;height:24px;border-radius:7px;font-family:var(--disp);font-weight:700;font-size:13px;padding:0 6px}
.pill.g-hi{background:var(--ap-t);color:var(--ap)}.pill.g-mid{background:var(--fit-t);color:var(--fit)}.pill.g-lo{background:#f9e5e2;color:#c0392b}
.minib{background:var(--maroon-t);color:var(--maroon);border:none;border-radius:8px;font-family:var(--disp);font-weight:700;font-size:12px;padding:6px 10px;cursor:pointer}
.minib:hover{background:#ecd5d9}
/* ── workout builder: a real training plan — rows, sets × reps, drag ⠿ to arrange ── */
.inclass{display:flex;align-items:center;flex-wrap:wrap;gap:7px;background:var(--fund-t);border:1px solid #bfe6e2;border-radius:12px;padding:10px 13px;margin:10px 0 2px}
.inclass .ic-h{font-family:var(--disp);font-weight:800;font-size:12.5px;color:#0b6a62}
.inclass .ic-chip{background:#fff;border:1px solid #bfe6e2;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:#0b6a62}
.inclass .ic-note{font-size:11.5px;color:var(--muted)}
.wkcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--maroon);border-radius:16px;padding:4px 10px 6px;margin:16px 0 4px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.wkcard-h{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 10px;font-family:var(--disp);font-weight:800;font-size:18px}
.wkcard-n{font-size:12px;color:var(--muted);font-weight:700;background:var(--paper);border-radius:999px;padding:3px 10px}
.wkpart{border-top:1px solid var(--line);padding:12px 4px 14px}
.wk-h{font-family:var(--disp);font-weight:800;font-size:15px;margin-bottom:8px;color:var(--maroon)}
.wk-h small{font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--muted)}
.wk-list{display:flex;flex-direction:column;gap:6px;min-height:4px}
.wk-row{display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:7px 9px;transition:box-shadow .12s,border-color .12s}
.wk-row.wk-drag{background:#fff;border-color:var(--maroon);box-shadow:0 10px 26px rgba(111,29,44,.22);position:relative;z-index:5}
body.wk-dragging,body.wk-dragging *{cursor:grabbing !important;user-select:none}
.wr-grip{cursor:grab;color:#a99f9d;font-size:17px;line-height:1;flex:none;padding:4px 3px;border-radius:6px;touch-action:none}
.wr-grip:hover{background:#ece6e4;color:var(--maroon)}
.wr-tag{flex:none;width:22px;text-align:center;font-size:15px}
.wr-tag.plain{color:#cfc7c5}
.wr-n{flex:1;font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-sr{display:flex;align-items:center;gap:5px;flex:none}
.wr-sr input{border:1px solid var(--line);border-radius:8px;padding:6px 6px;font-family:var(--disp);font-size:14px;font-weight:800;text-align:center;color:var(--ink);background:#fff}
.wr-sets{width:38px}.wr-reps{width:74px}
.wr-sr b{color:var(--muted);font-size:13px}
.wr-x{border:0;background:#0000000d;color:#777;border-radius:50%;width:22px;height:22px;line-height:1;font-size:11px;cursor:pointer;flex:none}
.wr-x:hover{background:#c0392b;color:#fff}
.wk-empty{font-size:12.5px;color:var(--muted);padding:9px 11px;border:1.5px dashed var(--line);border-radius:11px}
.wkpart[data-part=warmup] .wr-sets,.wkpart[data-part=warmup] .wr-sr b,.wkpart[data-part=cooldown] .wr-sets,.wkpart[data-part=cooldown] .wr-sr b{display:none}
.wk-pick{margin-top:9px}
.wk-pick>summary{display:inline-flex;align-items:center;gap:4px;list-style:none;cursor:pointer;font-family:var(--disp);font-weight:800;font-size:13px;color:#0b6a62;background:var(--fund-t);border:1px solid #bfe6e2;border-radius:999px;padding:6px 13px}
.wk-pick>summary::-webkit-details-marker{display:none}
.wk-pick[open]>summary{background:#0e8f86;color:#fff;border-color:#0e8f86}
.wk-tools{display:flex;flex-direction:column;gap:7px;margin-top:10px;padding:10px 11px;background:var(--paper);border:1px solid var(--line);border-radius:11px}
.wk-grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.wk-gl{font-family:var(--disp);font-weight:800;font-size:11.5px;color:var(--muted);width:96px;flex:none}
@media(max-width:520px){.wk-gl{width:100%}}
.wk-add{font-size:11.5px;font-weight:600;border:1px dashed #d9d0ce;background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;color:#6a5f5d}
.wk-add:hover{border-style:solid;border-color:var(--fund);color:#0b6a62;background:var(--fund-t)}
.wk-own{display:flex;gap:6px;margin-top:7px;max-width:420px}
.wk-owni{flex:1;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font:inherit;font-size:12.5px}
.wk-ownb{border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 12px;font-weight:800;cursor:pointer;color:var(--maroon);white-space:nowrap;font-size:12.5px}
@media(max-width:520px){.wr-reps{width:60px}.wr-sets{width:32px}.wr-n{font-size:13px}.wr-tag{display:none}}
/* train at home (homework) */
.hwbox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.hw-rule{font-size:13.5px;color:var(--ink-soft);line-height:1.5}.hw-rule b{color:var(--ink)}
.hw-bonus{color:#926410;font-weight:600}
.hw-week{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:11px 0 10px}
.hw-badge{font-family:var(--disp);font-weight:800;font-size:13px;background:#f1eee9;color:#7a6f71;border-radius:999px;padding:5px 12px}
.hw-badge.ok{background:#e4f5ec;color:#15724a}.hw-badge.star{background:#fbf0d4;color:#926410}
.hw-target{font-size:11.5px;color:var(--muted)}
.hw-add{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.hw-add-l{font-size:12.5px;color:var(--muted);font-weight:600}
.hw-btn{font-family:var(--disp);font-weight:700;font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--ink)}
.hw-btn:hover{border-color:var(--maroon)}.hw-btn.star:hover{border-color:#e0a100;background:#fff8e6}
.hw-logs{display:flex;flex-direction:column;gap:5px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.hw-log{display:flex;align-items:center;gap:10px;font-size:13px}
.hw-log .hw-d{font-family:var(--disp);font-weight:700;color:var(--muted);width:92px;flex:none}
.hw-log .hw-w{flex:1}.hw-log .hw-star{color:#926410;font-weight:700;font-size:12px}
.wk-fitt{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.wk-days{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.daychip{font-family:var(--disp);font-weight:700;font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;min-width:46px}
.daychip.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.wk-tf{display:flex;gap:16px;flex-wrap:wrap}
.wk-tf label{font-size:12px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:4px}
.wk-tf input,.wk-tf select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
/* ── goals redesign + at-a-glance progress ── */
.goalchips2{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.goalchip{font-family:var(--disp);font-weight:700;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.goalchip.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.goalsets{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.goalset{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.gs-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.gs-n{font-family:var(--disp);font-weight:800;font-size:16px}
.gs-now{font-size:13px;color:var(--muted);font-weight:600}
.gslider{width:100%;accent-color:var(--maroon);height:28px;cursor:pointer}
.gs-tval{font-size:14px;color:#444}
.gs-tval b{color:var(--maroon);font-family:var(--disp);font-size:16px}
.gs-tval small{color:var(--muted)}
.upcoming{background:#f1ede7;border-radius:13px;padding:13px 15px;margin:18px 0 0}
.up-h{font-family:var(--disp);font-weight:800;font-size:13px;color:var(--maroon);margin-bottom:6px}
.up-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;border-top:1px solid #00000010}
.up-row:first-of-type{border-top:0}
.up-e{font-size:16px;width:22px;text-align:center}
.up-n{font-family:var(--disp);font-weight:700;min-width:100px}
.up-d{color:var(--muted);font-size:12px}
.up-foot{font-size:12px;color:#555;margin-top:7px;border-top:1px solid #00000010;padding-top:7px}
.goalprog{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.pcard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;font:inherit}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pc-n{font-family:var(--disp);font-weight:800;font-size:15px}
.pc-pct{font-family:var(--disp);font-weight:800;font-size:14px;color:var(--maroon)}
.pc-done{font-family:var(--disp);font-weight:800;font-size:12px;color:#15724a;background:#e4f5ec;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pc-bar{height:9px;background:#efe9e2;border-radius:999px;overflow:hidden}
.pc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--maroon));border-radius:999px}
.pc-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

<script>
(function () {
'use strict';

// ═══════════════ utils ═══════════════
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root) => (root || document).querySelector(sel);
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }

// ═══════════════ sign-in + API bridge ═══════════════
// The page keeps the Google ID token for the tab session only and sends it with
// every request. The server verifies it with Google and answers for that
// student alone. Nothing else identifies the caller.
const CFG = window.PE_CONFIG || {};
const TOKEN_KEY = 'pe_token';
let token = null;
function tokenExpired(t) {
  try { const p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return !p.exp || p.exp * 1000 < Date.now() + 30000; }
  catch (e) { return true; }
}
function loadToken() { try { const t = sessionStorage.getItem(TOKEN_KEY); if (t && !tokenExpired(t)) return t; } catch (e) {} return null; }
function keepToken(t) { token = t; try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
function dropToken() { token = null; try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }

async function rawCall(action, payload) {
  if (!CFG.apiUrl) throw new Error('This page is not connected to the data service yet');
  const r = await fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ action, token }, payload || {})) });
  const j = await r.json();
  if (!j || !j.ok) { const e = new Error((j && j.error) || 'Request failed'); e.authRequired = !!(j && j.authRequired); throw e; }
  return j.data;
}
// Apps Script caps simultaneous runs; a whole class tapping at once produces
// transient errors. Retry those with backoff; permanent ones surface at once.
const PERMANENT = /Unknown style|Unknown action|Incomplete|class list|not connected|Bad request/i;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function call(action, payload) {
  let delay = (window.__preview && window.__preview.fastRetry) ? 30 : 1200;
  for (let attempt = 0; ; attempt++) {
    try { return await rawCall(action, payload); }
    catch (e) {
      if (e.authRequired) { dropToken(); showSignin('Your sign-in expired. Please sign in again.'); throw e; }
      if (PERMANENT.test(e.message) || attempt >= 4) throw e;
      await sleep(delay + Math.random() * delay); delay = Math.min(delay * 2, 15000);
    }
  }
}

// ── Sign in with Google (Google Identity Services) ──
function signinView(msg) {
  return '<div class="signin"><div class="k">GRADE 8 PE · FIS</div><h1>My PE Profile</h1>' +
    '<p>Sign in with your <b>FIS Google account</b> to open your profile.</p>' +
    (msg ? '<p class="note">' + esc(msg) + '</p>' : '') +
    '<div class="gbtn" id="gbtn"><div class="spinner"></div></div>' +
    '<p class="small">Only FIS accounts work here. Your name and photo come from your Google account while you’re signed in and are never stored by this page.</p></div>';
}
function gisReady(cb) {
  if (window.google && google.accounts && google.accounts.id) return cb();
  let n = 0;
  const t = setInterval(() => {
    if (window.google && google.accounts && google.accounts.id) { clearInterval(t); cb(); }
    else if (++n > 100) { clearInterval(t); const el = $('#gbtn'); if (el) el.innerHTML = '<p class="note">Couldn’t load Google sign-in. Check the connection and reload.</p>'; }
  }, 100);
}
let gisInit = false;
function showSignin(msg) {
  document.body.classList.remove('dark');
  $('#app').innerHTML = signinView(msg);
  gisReady(() => {
    // Same shape as the other FIS portals: the rendered button in popup mode, no One Tap.
    // One Tap / FedCM misbehaves behind some managed-device filters.
    if (!gisInit) { google.accounts.id.initialize({ client_id: CFG.clientId, callback: onCredential, hd: CFG.domain, ux_mode: 'popup', auto_select: false, cancel_on_tap_outside: true, itp_support: true }); gisInit = true; }
    const el = $('#gbtn'); if (!el) return; el.innerHTML = '';
    google.accounts.id.renderButton(el, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: 280 });
  });
}
function onCredential(resp) { if (resp && resp.credential) { keepToken(resp.credential); boot(); } }
function signOut() { dropToken(); try { google.accounts.id.disableAutoSelect(); } catch (e) {} showSignin(); }

// ═══════════════ PE Styles (visual skins; the server holds the names) ═══════════════
const SKINS = {
  competitor: { e: '🏆', d: 'I love to compete and give everything.',          ink: ['#8f2130', '#7a1b28', '#4d0f18'], acc: '#f0c24a', accs: '#ffe08a', rib: '#3a1008' },
  team:       { e: '🤝', d: 'I’m at my best lifting the team up.',         ink: ['#12726a', '#0e615a', '#063d38'], acc: '#8fe0c8', accs: '#c9f5e8', rib: '#053d36' },
  improver:   { e: '📈', d: 'I’m all about getting better than I was.',    ink: ['#b5560e', '#9c4a0c', '#5e2c06'], acc: '#f3c07a', accs: '#ffe0b8', rib: '#4a2200' },

};
const ORDER = ['competitor', 'team', 'improver', 'explorer', 'energizer', 'thinker', 'grafter', 'technician'];
const DEFAULT_SKIN = { e: '✨', ink: ['#7d2233', '#6f1d2c', '#4a1019'], acc: '#e7b64b', accs: '#f3d689', rib: '#3a1008' };
function hexA(h, a) { h = h.replace('#', ''); return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')'; }
function setSkin(k) {

  r.setProperty('--ink1', s.ink[0]); r.setProperty('--ink2', s.ink[1]); r.setProperty('--ink3', s.ink[2]);

// ═══════════════ radar (placeholder shape until Combine data exists — v3) ═══════════════
const AX = ['STAMINA', 'STRENGTH', 'SPEED', 'SKILLS', 'TEAM', 'EFFORT'], PLACE = [.62, .55, .6, .55, .7, .72];
const cx = 150, cy = 90, R = 60;
function pt(i, v) { const a = (-90 + i * 60) * Math.PI / 180; return [cx + R * v * Math.cos(a), cy + R * v * Math.sin(a)]; }
function radar(skin, vals) {
  let g = '';
  for (let r = 1; r <= 4; r++) { const p = []; for (let i = 0; i < 6; i++) p.push(pt(i, r / 4).join(',')); g += '<polygon points="' + p.join(' ') + '" fill="none" stroke="rgba(255,255,255,.14)"/>'; }
  for (let i = 0; i < 6; i++) { const [x, y] = pt(i, 1.3); const an = Math.abs(x - cx) < 5 ? 'middle' : (x > cx ? 'start' : 'end'); g += '<text x="' + x.toFixed(1) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="' + an + '" class="rlabel">' + AX[i] + '</text>'; }
  const shape = (vals && vals.length === 6) ? vals.map(v => Math.max(0.12, Math.min(1, v))) : null;
  const poly = shape || PLACE;
  g += '<polygon points="' + poly.map((v, i) => pt(i, v).map(n => n.toFixed(1)).join(',')).join(' ') + '" fill="' + hexA(skin.acc, .3) + '" stroke="' + skin.accs + '" stroke-width="2.2"/>';
  if (shape) { for (let i = 0; i < 6; i++) { const [x, y] = pt(i, poly[i]); g += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.6" fill="' + skin.accs + '"/>'; } }
  else g += '<text x="150" y="187" text-anchor="middle" class="rnote">your shape fills in at the Combine</text>';
  return '<svg viewBox="0 0 300 190" width="100%" height="160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six-sided fitness and skills chart">' + g + '</svg>';
}
// Map the student's measured data onto the six card axes (0–1 each). Null until there is anything.
function cardAxes(m) {
  if (!m) return null;
  const f = m.fitness || {}, sk = m.skills || {}, ap = m.ap || {}, c01 = v => Math.max(0, Math.min(1, v));
  const mile = latestOf(f.mile), push = latestOf(f.pushups), grip = latestOf(f.grip), sprint = latestOf(f.sprint);
  const skVals = SKILL_ORDER.map(k => latestOf(sk[k])).filter(v => v != null);
  const apv = key => { const a = ap[key]; if (!a) return null; return a.tchr != null ? a.tchr : a.self; };
  if (!(mile != null || push != null || grip != null || sprint != null || skVals.length || apv('team') != null || apv('effort') != null)) return null;
  const strength = [push != null ? c01(push / 35) : null, grip != null ? c01(grip / 45) : null].filter(v => v != null);
  return [
    mile != null ? c01(1 - (mile - 360) / 360) : 0.12,                 // STAMINA (mile: 6:00→1, 12:00→0)
    strength.length ? strength.reduce((a, b) => a + b, 0) / strength.length : 0.12, // STRENGTH
    sprint != null ? c01(1 - (sprint - 4.5) / 3) : 0.12,               // SPEED (4.5s→1, 7.5s→0)
    skVals.length ? (skVals.reduce((a, b) => a + b, 0) / skVals.length) / 6 : 0.12, // SKILLS
    apv('team') != null ? apv('team') / 7 : 0.12,                      // TEAM
    apv('effort') != null ? apv('effort') / 7 : 0.12                   // EFFORT
  ];
}

    const grip = e.target.closest('[data-grip]'); if (!grip) return;
    dragEl = grip.closest('.wk-row'); if (!dragEl) return;

    if (overRow && overRow !== dragEl) {
      const rc = overRow.getBoundingClientRect();
      overRow.parentNode.insertBefore(dragEl, (e.clientY < rc.top + rc.height / 2) ? overRow : overRow.nextSibling);
    } else if (!overRow && overList && dragEl.parentNode !== overList) {
      overList.appendChild(dragEl);

    if (!dragEl) return;

    dragEl = null; try { root.releasePointerCapture(pid); } catch (x) {}

  }

  root.addEventListener('pointercancel', endDrag);
}

    return '<label class="enrow"><span class="en-n">' + em + ' ' + esc(RUBRICS.ladders[k].name) + '</span><span class="en-in"><select id="my-' + k + '" class="lvsel"' + (locked ? ' disabled' : '') + '>' + opts + '</select></span></label>';
  }).join('');
  const cpOpts = CPS.map(cp => '<option value="' + cp + '"' + (cp === entryCp ? ' selected' : '') + '>' + CP_LABEL[cp] + '</option>').join('');
  return '<div class="wrap">' +
    '<button type="button" class="back light" id="toprofile">← Back to my profile</button>' +
    '<div class="phero"><div class="k">FUNDAMENTAL SKILLS</div><h1>Record my skill levels</h1><p>Set the level you reached on each ladder, ' + esc(b.student.first) + '. Your teacher checks and signs off — and can change it.</p>' +
    '<div class="cpick">Checkpoint <select id="mycp">' + cpOpts + '</select></div></div>' +
    (locked ? '<div class="lockmsg">🔒 Your teacher has locked ' + CP_LABEL[entryCp] + ' — these are final. Ask them to unlock if something needs changing.</div>' : '') +
    '<div class="enform">' + rows + '</div>' +
    '<div class="pbar"><div class="pcount">Honest levels — your teacher signs them off.</div>' + (locked ? '' : '<button type="button" class="ct-btn" id="mysave">Save my levels</button>') + '</div>' +
  '</div>';
}
async function saveMySkillsUI() {
  const btn = $('#mysave'); btn.disabled = true; btn.textContent = 'Saving…';
  const levels = {};
  SKILL_ORDER.forEach(k => { const el = $('#my-' + k); const v = el ? el.value : ''; if (v !== '') levels[k] = Number(v); });
  try {
    await call('saveMySkills', { checkpoint: entryCp, levels: levels });
    const m = state.student.combine || { fitness: {}, skills: {}, ap: {}, bands: {}, goals: [], plan: null };
    m.skills = m.skills || {};
    Object.keys(levels).forEach(k => { m.skills[k] = m.skills[k] || {}; m.skills[k][entryCp] = levels[k]; });
    state.student.combine = m;
    toast('Levels saved.'); show('profile');
  } catch (e) { btn.disabled = false; btn.textContent = 'Save my levels'; toast('Couldn’t save: ' + e.message, true); }
}

function message(big, title, body, extra) {
  return '<div class="msg"><div class="big">' + big + '</div><h2>' + esc(title) + '</h2><p>' + body + '</p>' + (extra || '') + '</div>';
}
function otherView(b) {
  const out = '<p class="small"><button type="button" class="lnk" id="signout">Not you? Sign out and use another account</button></p>';
  return otherView_(b) + out;
}
function otherView_(b) {
  switch (b.role) {
    case 'teacher':
      return message('🧑‍🏫', 'Teacher view', 'You’re signed in as <code>' + esc(b.email) + '</code>, which is on the Teachers tab but not the Students tab. Students who open this link see their own profile.',
        '<p>To see the student view yourself, add your address to the Students tab. Student data lives only in the Sheet.</p>');
    case 'unknown':
      return message('🔎', 'Not on the Grade 8 list yet', 'You’re signed in as <code>' + esc(b.email) + '</code>. That account isn’t on the Grade 8 PE class list.',
        '<p>Tell your PE teacher, or check you opened the link with your FIS account.</p>');
    case 'wrong_domain':
      return message('🔒', 'Use your FIS account', 'This page only works with an FIS Google account.',
        '<p>Sign out and sign in again with your FIS account.</p>');
    default:
      return message('🙈', 'Couldn’t confirm who you are', 'Google didn’t confirm which account is signed in.',
        '<p>Sign out and try again. If it keeps happening, tell your PE teacher.</p>');
  }
}

// ═══════════════ overlay ═══════════════
function openOv(k) {
  let html = '<button class="x" type="button" data-close="1">✕</button>';
  if (k.startsWith('fund-')) {
    const key = k.slice(5), lad = RUBRICS.ladders[key], em = (FUND.find(f => f[0] === key) || ['', '🧩'])[1];
    const m = measured(), lv = m && m.skills ? latestOf(m.skills[key]) : null;
    html += '<h4>' + em + ' ' + esc(lad.name) + '</h4><div class="om">Fundamental skill · 6-level ladder · cleared self → peer → teacher</div>';
    lad.levels.forEach((t, i) => { const on = lv === (i + 1); html += '<div class="lad' + (on ? ' here' : '') + '"><span class="lv">L' + (i + 1) + '</span><span>' + esc(t) + '</span>' + (on ? '<span class="youre">you are here</span>' : '') + '</div>'; });
    html += lv == null ? '<div class="ovfeeds"><b>Not yet tested.</b> Your first level comes from the September Combine, then Jan → May.</div>'
                       : '<div class="ovfeeds">You are at <b>Level ' + lv + '</b>. Grade 8 "meeting" is L' + G8_BAND + '. Keep climbing.</div>';
  } else if (k.indexOf('fit-') === 0 && FIT_EMOJI[k.slice(4)]) {
    const key = k.slice(4), meta = fitMeta(key), m = measured(), series = m && m.fitness ? m.fitness[key] : null;
    html += '<h4>' + FIT_EMOJI[key] + ' ' + esc(meta.label) + '</h4><div class="om">' + esc(meta.unit) + ' · ' + (meta.dir === 'down' ? 'lower is better' : 'higher is better') + '</div>' +
      '<div class="ovnow"><div class="l">WHAT THIS IS</div><div class="t">' + esc(FITINFO[key] || '') + '</div></div>';
    if (series && Object.keys(series).length) {
      html += '<div class="ovtrend">' + CPS.filter(cp => cp in series).map(cp => '<div class="ovt"><span>' + CP_LABEL[cp] + '</span><b>' + (key === 'mile' ? mileStr(series[cp]) : fmtNum(series[cp])) + '</b></div>').join('') + '</div>';
    } else {
      html += '<div class="ovnext"><div class="l">↗ WHEN IT FILLS IN</div><div class="t">Your first number comes from the September Combine, then Jan → May.</div></div>';
    }
  } else {
    const d = D[k]; if (!d) return;
    html += '<h4>' + d.e + ' ' + esc(d.t) + '</h4><div class="om">' + esc(d.m) + '</div>' +
      '<div class="ovnow"><div class="l">WHAT THIS IS</div><div class="t">' + esc(d.what) + '</div></div>' +
      '<div class="ovnext"><div class="l">↗ WHEN IT FILLS IN</div><div class="t">' + esc(d.when) + '</div></div>';
  }
  $('#ovcard').innerHTML = html; $('#ov').classList.add('show');
}
function closeOv() { $('#ov').classList.remove('show'); }

// ═══════════════ interactions ═══════════════
function applySkin(k) {
  const s = SKINS[k]; if (!s) return;
  setSkin(k);
  $('#archt').textContent = state.styles[k].toUpperCase(); $('#arche').textContent = s.e;
  $('#rad').innerHTML = radar(s, cardAxes(measured()));
  document.querySelectorAll('.sbtn').forEach(b => { const on = b.dataset.k === k; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); });
}
async function choose(k) {
  if (!SKINS[k] || k === state.student.style) { applySkin(k); return; }
  const prev = state.student.style;
  applySkin(k);
  const saved = $('#saved'); saved.textContent = 'saving…';
  document.querySelectorAll('.sbtn').forEach(b => b.disabled = true);
  try {
    const res = await call('saveStyle', { style: k });
    state.student.style = res.style; saved.textContent = '✓ saved';
    toast('Saved. You’re ' + state.styles[k] + '.');
  } catch (e) {
    saved.textContent = prev ? '✓ saved' : '';
    if (prev) applySkin(prev); else { setSkin(''); $('#archt').textContent = 'PICK A STYLE'; $('#arche').textContent = '✨'; $('#rad').innerHTML = radar(DEFAULT_SKIN, cardAxes(measured())); document.querySelectorAll('.sbtn').forEach(b => { b.classList.remove('sel'); b.setAttribute('aria-pressed', 'false'); }); }
    toast('Couldn’t save: ' + e.message, true);
  } finally { document.querySelectorAll('.sbtn').forEach(b => b.disabled = false); }
}

function pick(k, field, val) {
  draft[k] = Object.assign({}, draft[k], { [field]: val });
  const item = $('#pi-' + k);
  item.querySelectorAll(field === 'rating' ? '.tl' : '.fq').forEach(b => { const on = b.dataset[field] === val; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  const d = draft[k]; item.classList.toggle('done', !!(d.rating && d.freq));
  const n = draftDone(); $('#pdone').textContent = n; $('#pfill').style.width = Math.round(100 * n / ITEMS.length) + '%';
  $('#psave').disabled = n !== ITEMS.length;
  // nudge to the next unrated item on small screens
  if (d.rating && d.freq) { const next = ITEMS.find(i => !(draft[i.k] && draft[i.k].rating && draft[i.k].freq)); if (next && window.innerWidth < 760) { const el = $('#pi-' + next.k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }
}
async function savePrediction() {
  const btn = $('#psave'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await call('savePrediction', { checkpoint: CP, answers: draft });
    state.student.predictions = Object.assign({}, state.student.predictions, { [CP]: res.prediction });
    show('summary');
  } catch (e) { btn.disabled = false; btn.textContent = 'Save my prediction'; toast('Couldn’t save: ' + e.message, true); }
}
const wire = (id, fn) => { const el = $('#' + id); if (el) el.addEventListener('click', fn); };

function show(v, arg) {
  view = v;
  const app = $('#app');
  document.body.classList.toggle('dark', v === 'card');
  if (state.student) setSkin(state.student.style);
  if (v === 'predict') {
    const saved = predictionSaved(); draft = saved ? JSON.parse(JSON.stringify(saved.items)) : {};
    app.innerHTML = predictView(state);
    app.addEventListener('click', e => { const t = e.target.closest('.tl,.fq'); if (!t) return; if (t.dataset.rating) pick(t.dataset.k, 'rating', t.dataset.rating); else pick(t.dataset.k, 'freq', t.dataset.freq); });
    wire('psave', savePrediction); wire('toprofile', () => show('profile'));
  } else if (v === 'summary') {
    app.innerHTML = summaryView(state);
    wire('toprofile', () => show('profile')); wire('topredict', () => show('predict'));
  } else if (v === 'compare') {
    app.innerHTML = compareView(state);
    wire('toprofile', () => show('profile')); wire('topredict', () => show('predict'));
  } else if (v === 'card') {
    app.innerHTML = cardView(state);
    $('#styles').addEventListener('click', e => { const btn = e.target.closest('.sbtn'); if (btn) choose(btn.dataset.k); });
    $('#toprofile').addEventListener('click', () => show('profile'));
    $('#toprofile2').addEventListener('click', () => show('profile'));
  } else if (v === 'entry') {
    app.innerHTML = entryView(state);
    wire('toprofile', () => show('profile')); wire('ensave', saveEntry);
    const cp = $('#encp'); if (cp) cp.addEventListener('change', () => { entryCp = cp.value; show('entry'); });
  } else if (v === 'goals') {
    app.innerHTML = goalsView(state);
    wire('toprofile', () => show('profile')); wire('gsave', saveGoalsUI);
    const gc = $('#goalchips2'); if (gc) gc.addEventListener('click', e => { const c = e.target.closest('.goalchip'); if (c) { const k = c.getAttribute('data-g'); goalSel[k] = !goalSel[k]; show('goals'); } });
    document.querySelectorAll('.gslider').forEach(r => r.addEventListener('input', () => { const k = r.getAttribute('data-key'), meta = goalMetaFor(k), lab = $('#glb-' + k); if (lab && meta) lab.innerHTML = fmtMetric(meta, Number(r.value)) + (meta.dir === 'down' ? ' <small>· lower is better</small>' : ''); }));
  } else if (v === 'plan') {
    app.innerHTML = planView(state);
    wire('toprofile', () => show('profile')); wire('psaveplan', savePlanUI); wire('toeditgoals', () => show('goals'));
    const w = app.querySelector('.wrap');
    if (w) {
      w.addEventListener('click', e => {
        const add = e.target.closest('[data-add]'); if (add) { syncPlanFromDom(); const d = wkDefaults(add.dataset.add, add.dataset.c || ''); planDraft[add.dataset.add].push({ n: add.dataset.n, c: add.dataset.c || '', sets: d.sets, reps: d.reps }); return show('plan'); }
        const rm = e.target.closest('[data-rm]'); if (rm) { const row = rm.closest('.wk-row'), list = row && row.parentNode; if (list) { const idx = Array.prototype.indexOf.call(list.querySelectorAll('.wk-row'), row), part = list.getAttribute('data-part'); syncPlanFromDom(); planDraft[part].splice(idx, 1); } return show('plan'); }
        const own = e.target.closest('[data-own]'); if (own) { const inp = w.querySelector('.wk-owni[data-part="' + own.dataset.own + '"]'); const v2 = inp && inp.value.trim(); if (v2) { syncPlanFromDom(); const d = wkDefaults(own.dataset.own, ''); planDraft[own.dataset.own].push({ n: v2.slice(0, 40), c: '', sets: d.sets, reps: d.reps }); show('plan'); } return; }
        const day = e.target.closest('[data-day]'); if (day) { syncPlanFromDom(); planDraft.days[day.dataset.day] = !planDraft.days[day.dataset.day]; return show('plan'); }
        const lg = e.target.closest('[data-log]'); if (lg) { syncPlanFromDom(); planDraft.log = planDraft.log || []; if (planDraft.log.length < 60) planDraft.log.push({ date: isoDay(new Date()), who: lg.dataset.log }); toast(WHO[lg.dataset.log][2] ? 'Logged — ⭐ buddy bonus!' : 'Logged. Nice work.'); return show('plan'); }
        const lr = e.target.closest('[data-logrm]'); if (lr) { syncPlanFromDom(); const p = lr.dataset.logrm.split('|'), j = (planDraft.log || []).findIndex(x => x.date === p[0] && x.who === p[1]); if (j >= 0) planDraft.log.splice(j, 1); return show('plan'); }
      });
      w.querySelectorAll('.wk-pick').forEach(d => d.addEventListener('toggle', () => { wkOpen[d.dataset.part] = d.open; }));
      enableWkDrag(w);
    }
  } else if (v === 'myskills') {
    app.innerHTML = myskillsView(state);
    wire('toprofile', () => show('profile')); wire('mysave', saveMySkillsUI);
    const cp = $('#mycp'); if (cp) cp.addEventListener('change', () => { entryCp = cp.value; show('myskills'); });
  } else if (v === 'class') {
    app.innerHTML = classView();
    wire('toprofileT', () => { if (state.role === 'student') show('profile'); else renderTeacher(state); });
    const cl = $('#mxclass'); if (cl) cl.addEventListener('change', () => { teacherFilter = cl.value; show('class'); });
    document.querySelectorAll('.cpbtn').forEach(b => b.addEventListener('click', () => { teacherCp = b.getAttribute('data-cp'); show('class'); }));
    document.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => { const c = th.getAttribute('data-sort'); if (teacherSort.col === c) teacherSort.dir *= -1; else teacherSort = { col: c, dir: 1 }; show('class'); }));
    const tbl = app.querySelector('table.mx');
    if (tbl) {
      tbl.addEventListener('change', e => { const sel = e.target.closest('.cellsel'); if (sel) mxSaveCell(sel); });
      tbl.addEventListener('click', e => { const lb = e.target.closest('[data-lock]'); if (lb) mxToggleLock(lb.getAttribute('data-lock')); });
    }
    wire('mxlockall', () => mxLockAll(true)); wire('mxunlockall', () => mxLockAll(false)); wire('mxcsv', mxExportCsv);
  } else if (v === 'skillentry') {
    currentSid = arg || currentSid;
    app.innerHTML = skillEntryView(currentSid);
    wire('toclassback', () => show('class')); wire('sksave', () => saveSkillsUI(currentSid));
    const cp = $('#skcp'); if (cp) cp.addEventListener('change', () => { teacherCp = cp.value; show('skillentry', currentSid); });
  } else {
    app.innerHTML = profileView(state);
    $('#tocard').addEventListener('click', () => show('card'));
    wire('topredict', () => show('predict')); wire('tocompare', () => show('compare'));
    goalSel = null; planDraft = null;
    wire('toentry', () => show('entry')); wire('togoals', () => show('goals')); wire('toplan', () => show('plan'));
    wire('togoals2', () => show('goals')); wire('togoals3', () => show('goals'));
    wire('tomyskills', () => show('myskills')); wire('toteacher', loadClass);
    app.addEventListener('click', e => { const t = e.target.closest('[data-ov]'); if (t) openOv(t.dataset.ov); });
  }
  window.scrollTo(0, 0);
}

function render(b) {
  state = b;
  if (b.role === 'student') { show(b.student.style ? 'profile' : 'card'); return; } // first visit → build your card
  if (b.role === 'teacher') { renderTeacher(b); return; }
  document.body.classList.remove('dark'); $('#app').innerHTML = otherView(b); wire('signout', signOut);
}
function renderTeacher(b) {
  document.body.classList.remove('dark');
  $('#app').innerHTML = teacherLanding(b);
  wire('toclass', loadClass); wire('signout', signOut);
}
async function loadClass() {
  $('#app').innerHTML = '<div class="loading"><div class="spinner"></div>Loading the class…</div>';
  try { classData = await call('classOverview'); show('class'); }
  catch (e) { toast('Couldn’t load the class: ' + e.message, true); if (state.role === 'student') show('profile'); else renderTeacher(state); }
}

$('#ov').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) closeOv(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOv(); });

async function boot() {
  $('#app').innerHTML = '<div class="loading"><div class="spinner"></div>Loading your profile…</div>';
  try { render(await call('bootstrap')); }
  catch (e) { if (e.authRequired) return; $('#app').innerHTML = message('⚠️', 'Couldn’t load your profile', esc(e.message), '<p><a class="btn" href="javascript:location.reload()">Try again</a></p><p class="small"><button type="button" class="lnk" id="signout">Sign out</button></p>'); wire('signout', signOut); }
}
function main() { token = loadToken(); if (token) boot(); else showSignin(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main); else main();
})();
</script>

</body>
</html>

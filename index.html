<title>G7 AP Check-out</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@300..700&display=swap">
<style>
/* Layout: indigo "arcade" backdrop with white sticker cards (thick ink outline, hard offset shadow).
   Bands are four bright, equal-weight colours (sky, sun, mint, violet) with emoji, so no band looks like a red mark.
   Pink = main action. Orange = Mr Bain's marker. Single bright look on purpose: it is shown on a classroom iPad. */
:root{
  --bg:#3B2A9B; --ink:#1B1340; --paper:#FFFFFF; --muted:#5A5380; --line:#DCD6F7; --soft:#F3F0FF;
  --on-bg:#FFFFFF; --cta:#FF5E8A; --pop:#FF8A1F; --sun-soft:#FFF3B8;
  --b0:#A8E0FF; --b1:#FFE066; --b2:#7CE8B1; --b3:#C9A8FF;
  --f-body:'Lexend',Verdana,system-ui,sans-serif; --f-head:'Fredoka','Lexend',Verdana,sans-serif;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(circle,rgba(255,255,255,.14) 2px,transparent 2.5px);background-size:30px 30px;
  color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--pop);outline-offset:3px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 4px}
.brand{font-family:var(--f-head);font-weight:700;font-size:38px;line-height:1;color:var(--on-bg);letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:#D9D2FF;margin-top:6px;letter-spacing:.02em}
.tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tab{border:3px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 20px;font-family:var(--f-head);font-weight:600;font-size:20px;box-shadow:0 4px 0 var(--ink)}
.tab[aria-current="page"]{background:var(--b1)}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.sel{border:3px solid var(--ink);background:var(--paper);border-radius:14px;padding:9px 12px;min-height:48px;font-weight:500}
.shchip{font-size:13px;font-weight:600;color:#44546A;margin:4px 2px 8px}.shchip[data-s=err]{background:#FFD6D6;color:#5A0A0A;border:2px solid #5A0A0A;border-radius:12px;padding:8px 12px;font-size:15px}.shchip[data-s=off]{background:#FFF3C4;color:#4A3B00;border:2px solid #4A3B00;border-radius:12px;padding:8px 12px;font-size:15px}
.nosave{background:#FFD6D6;color:#5A0A0A;border:3px solid #5A0A0A;border-radius:16px;padding:12px 16px;font-size:16px;font-weight:700}
.demo{background:var(--b1);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;font-size:15px;font-weight:500}

.ctrl{display:flex;flex-wrap:wrap;gap:14px 30px;align-items:flex-end;background:var(--paper);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:22px;padding:16px 18px}
.ctrl>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.lab{font-family:var(--f-head);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{border:3px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 16px;min-height:46px;font-family:var(--f-head);font-weight:600;font-size:18px}
.chip-btn[aria-pressed="true"]{background:var(--cta)}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:10px 18px;min-height:46px;font-family:var(--f-head);font-weight:600;font-size:18px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

.stage{background:var(--paper);border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);border-radius:30px;padding:28px;display:flex;flex-direction:column;gap:22px;min-height:440px}
.stage h2{font-family:var(--f-head);font-size:52px;font-weight:700;line-height:1.05}
.sub{color:var(--muted);font-size:19px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.name{min-height:84px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 5px 0 var(--ink);border-radius:20px;font-family:var(--f-head);font-size:26px;font-weight:600;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;overflow-wrap:anywhere}
.name:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);background:var(--b1)}
.name.done{background:var(--b2);box-shadow:0 5px 0 var(--ink)}
.tick{font-family:var(--f-body);font-size:15px;font-weight:600}
.steps{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step{font-family:var(--f-head);font-size:17px;font-weight:600;padding:4px 14px;border-radius:999px;border:3px solid var(--line);color:var(--muted)}
.step.on{border-color:var(--ink);background:var(--cta);color:var(--ink)}
.step.ok{border-color:var(--ink);background:var(--b2);color:var(--ink)}

.bands{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.bands{grid-template-columns:1fr 1fr}}
.band{display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);border-radius:26px;padding:20px 22px 22px;min-height:190px;min-width:0;color:var(--ink)}
.band:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.band .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border:3px solid var(--ink);border-radius:999px;padding:3px 16px 3px 10px;font-family:var(--f-head);font-weight:700;font-size:22px;line-height:1.2}
.band .bl{font-size:clamp(22px,2.4vw,28px);line-height:1.3;font-weight:600}
.b0{background:var(--b0);color:var(--ink)}.b1{background:var(--b1);color:var(--ink)}.b2{background:var(--b2);color:var(--ink)}.b3{background:var(--b3);color:var(--ink)}
.em{font-style:normal;line-height:1;font-size:1.25em}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:3px solid var(--ink);background:var(--paper);border-radius:16px;padding:10px 22px;min-height:50px;font-family:var(--f-head);font-weight:600;font-size:20px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--cta)}
.btn.warn{background:var(--b1)}
.next{background:var(--sun-soft);border:3px solid var(--ink);border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.next b{font-family:var(--f-head);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.next p{font-size:22px;font-weight:500}
.party{font-size:72px;line-height:1}
@media (prefers-reduced-motion:no-preference){.party{animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:scale(1) rotate(0)}}}

.crit{background:var(--paper);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.crit h3{font-family:var(--f-head);font-size:34px;font-weight:700;line-height:1.05;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.crit h3 span{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg-b{border:3px solid var(--ink);padding:8px 0 6px;border-radius:14px;font-size:10.5px;letter-spacing:-.01em;font-weight:600;text-align:center;overflow-wrap:normal;word-break:normal;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg-b .em{font-size:22px}
.mk{font-family:var(--f-head);font-size:15px;font-weight:700;border:3px solid var(--ink);border-radius:999px;padding:1px 12px;justify-self:center;white-space:nowrap;color:var(--ink)}
.mk.t{background:var(--pop)}
.mk.s{background:var(--paper)}
.hist{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.h{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--ink);border-radius:10px;padding:2px 9px 2px 6px;font-size:13px;font-weight:500;color:var(--ink)}
.h .em{font-size:15px}
.h.none{border:2px dashed var(--line);color:var(--muted);background:transparent}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
.msg{font-size:18px}
.tw{overflow-x:auto;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);border-radius:22px;background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:780px}
th,td{padding:10px 12px;text-align:left;border-bottom:2px solid var(--line);vertical-align:top}
th{font-family:var(--f-head);font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
td .h{margin:0 4px 4px 0}
.gap{font-size:12px;background:var(--b1);border:2px solid var(--ink);border-radius:8px;padding:0 6px;display:inline-block}
.link{background:none;border:0;padding:0;font-weight:600;font-size:16px;text-decoration:underline;text-align:left}
.pg{color:var(--on-bg)}
.pgh{font-family:var(--f-head);font-size:52px;font-weight:700;line-height:1.05}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.card{background:var(--paper);border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-family:var(--f-head);font-size:30px;font-weight:700}
textarea{width:100%;min-height:160px;border:3px solid var(--ink);background:var(--soft);border-radius:14px;padding:10px;font-size:15px;resize:vertical}
.ok{font-weight:600}
.slots{display:flex;gap:14px}
.slot{width:96px;height:96px;border:4px dashed var(--ink);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:56px;background:var(--soft)}
.epad{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:12px;max-width:720px}
.eb{font-size:46px;line-height:1;padding:14px 0;border:3px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:0 5px 0 var(--ink)}
.eb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);background:var(--b1)}
.crow{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:2px solid var(--line)}
.crow span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.ecode{font-size:28px;letter-spacing:.1em}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lg{border:3px solid var(--ink);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.3}
.lg b{font-family:var(--f-head);font-size:19px;display:flex;align-items:center;gap:6px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.sc{background:var(--paper);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sn{font-family:var(--f-head);font-size:22px;font-weight:600;overflow-wrap:anywhere}
.abs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ab{border:3px solid var(--line);background:var(--soft);border-radius:14px;min-height:64px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;letter-spacing:-.02em;min-width:0;overflow:hidden}
.ab .em{font-size:24px}
.ab.on{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.ab.on.b0{background:var(--b0)}.ab.on.b1{background:var(--b1)}.ab.on.b2{background:var(--b2)}.ab.on.b3{background:var(--b3)}
.sd{font-size:12px;color:var(--muted)}
td.none{color:var(--muted)}
@media (max-width:520px){.stage{padding:18px}.stage h2,.pgh{font-size:38px}.brand{font-size:30px}.cols{grid-template-columns:1fr}}
</style>


<div class="wrap" id="app"></div>

<script>
(function(){
var BANDS=['Not yet','Approaching','Got it','Leading'];
var HELLO=['You are at the start. Small steps count.','You are on your way.','You do this well.','You lift the lesson for others.'];
/* Wording adapted from the G8 Rubric Bank for G7 English learners: short, common words, simple past tense. Draft for Mr Bain to approve. */
var CRITS=[
{id:'effort',name:'Effort',sub:'Active Participation',
 lines:['I did not join in much. I watched more than I played.','I worked hard some of the time. Sometimes I stopped trying.','I worked hard most of the lesson. I only stopped for short breaks.','I worked hard all lesson. I kept going when it was hard or I did not like the game.'],
 teach:['Minimal effort; often disengaged.','Effort and focus vary; sometimes off-task.','Usually works hard and stays engaged; occasional lapses.','Always full effort, including in activities they do not enjoy.'],
 next:['Join in every activity. Try your best for a few minutes at a time.','Work hard for the whole lesson. Keep going when the activity gets hard.','Work hard in activities you do not like. Keep going when others stop.','Keep it up. Tell a friend why joining in matters.']},
{id:'team',name:'Teamwork',sub:'Social Skills',
 lines:['I did not help my team much. I was not kind to others.','I helped my team some of the time. Sometimes I did not.','I was kind and respectful. I did my part for the team.','I said kind words. I helped someone join in or get better.'],
 teach:['Rarely communicates positively or contributes to the team.','Contribution and communication are inconsistent.','Communicates respectfully and helps the team most of the time.','Consistently positive, encourages others, helps teammates take part.'],
 next:['Say one kind thing to a teammate every lesson.','Be kind and do your part every lesson, not only some lessons.','Encourage others. Help a teammate join in or get better.','Keep helping. Show a new teammate how to play.']},
{id:'ready',name:'Ready',sub:'Self Management',
 lines:['I was late and not ready. I did not have my kit.','I was late or slow to start, or I did not have all my kit.','I had my PE kit. I was on time. I started right away.','I was ready early. I helped set up or helped others get ready.'],
 teach:['Often late, unprepared or missing kit.','Sometimes late, slow to start or missing kit; needs reminders.','Prepared, on time, starts without reminders; rare lapses.','Always prepared and on time; helps the lesson get going.'],
 next:['Bring your kit every lesson. Be on time.','Start right away without a reminder. Have all your kit.','Be ready early. Help set up or help others get ready.','Keep leading the set-up. Help a friend who is late.']},
{id:'grow',name:'Keep trying',sub:'Growth Mindset',
 lines:['I said no to a task, or I stopped trying quickly.','I did not try a challenge, or I stopped trying for a while.','I tried the challenges. I kept trying after mistakes.','I chose a harder challenge. I stayed positive when I made mistakes.'],
 teach:['Avoids challenges, refuses tasks or gives up quickly.','Sometimes avoids challenges or gives up when frustrated.','Takes on set challenges and keeps trying after mistakes.','Seeks harder challenges, tries new things, positive after setbacks.'],
 next:['Try each challenge once, even if it is hard.','Keep trying after a mistake. Do not stop when you feel frustrated.','Choose a harder challenge. Try something new. Stay positive after mistakes.','Help a friend try a new challenge.']},
{id:'focus',name:'Focus and safe',sub:'Self Awareness',
 lines:['I stopped others from learning. I did not stop after reminders.','I lost focus sometimes. I needed some reminders.','I stayed focused. I was safe with others. I did not need reminders.','I stayed focused all lesson. I helped keep the class calm and safe.'],
 teach:['Behaviour or focus regularly disrupts learning or safety.','Focus and self-control vary; needs frequent reminders.','Focused and safe without reminders; lapses are rare.','Consistently focused and in control; helps keep the class positive and safe.'],
 next:['Listen the first time. Stop when the teacher asks.','Stay focused for the whole lesson with fewer reminders.','Stay focused even when it is hard. Help keep the class calm and safe.','Keep the class positive and safe. Be a good example.']}
];
var CLASSES=['7(1C)','7(2A)'];
var KEY='g7ap.v1';

var EMO=['🌱','🏃','⭐','🚀'];
function bars(n){return '<i class="em" aria-hidden="true">'+EMO[n]+'</i>';}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function dm(s){return s.slice(8,10)+'.'+s.slice(5,7)+'.';}

/* data */
var mem=null;
var SH={url:'',tok:'',pulled:false,pulling:false,state:'wait',msg:'',at:'',timer:null,busy:false,again:false,quiet:false,sure:false};
function load(){try{var t=localStorage.getItem(KEY);if(t)return JSON.parse(t);}catch(e){}return mem;}
var SAVED=null;
function save(){mem=D;if(!SH.quiet){D.savedAt=Date.now();shSoon();}try{var j=JSON.stringify(D);localStorage.setItem(KEY,j);SAVED=(localStorage.getItem(KEY)===j);}catch(e){SAVED=false;}}
function storeOk(){if(SAVED!==null)return SAVED;try{localStorage.setItem(KEY+'.t','1');var ok=localStorage.getItem(KEY+'.t')==='1';localStorage.removeItem(KEY+'.t');return ok;}catch(e){return false;}}
function demo(){
 var D={demo:true,classes:{},ratings:[],focus:['effort','team']};
 var letters='ABCDEFGH'.split('');
 CLASSES.forEach(function(c,ci){D.classes[c]=letters.map(function(l){return 'Example student '+l;});});
 var seed=7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280;}
 var back=[1,3,6,8,10];
 CLASSES.forEach(function(c){D.classes[c].forEach(function(n,i){
  CRITS.forEach(function(cr,k){
   var base=Math.max(0,Math.min(3,Math.round(1+rnd()*2.2-0.1)));
   D.ratings.push({cls:c,n:n,c:cr.id,b:Math.max(0,Math.min(3,base+(i%3===0?-0:0))),by:'teacher',r:1,d:ymd(new Date(Date.now()-12*864e5))});
   if(i<5)D.ratings.push({cls:c,n:n,c:cr.id,b:Math.max(0,Math.min(3,base+(rnd()>.5?1:0))),by:'teacher',r:2,d:ymd(new Date(Date.now()-2*864e5))});
   if(cr.id==='effort'||cr.id==='team'||k===2){
    back.forEach(function(b){var v=Math.max(0,Math.min(3,base+Math.round(rnd()*2-1)+(i%4===1?1:0)));
     D.ratings.push({cls:c,n:n,c:cr.id,b:v,by:'self',d:ymd(new Date(Date.now()-b*864e5))});});
   }
  });
 });});
 CLASSES.forEach(function(c){D.classes[c].slice(0,6).forEach(function(n,i){['ru.pass','ru.att','ru.def'].forEach(function(id,k){D.ratings.push({cls:c,n:n,c:id,b:Math.min(3,(i+k)%4),by:'asm',p:'practice',d:ymd(new Date(Date.now()-6*864e5))});});});});
 return D;
}
var D=load()||demo();
var EM=['⚽','🏀','🏐','🏈','🎾','🏓','🏸','🥊','🏊','🚴','🛹','🥇'];
function newCode(cls){var m=D.codes[cls]||{},used=Object.keys(m).map(function(k){return m[k];}),c;
 do{c=EM[Math.floor(Math.random()*EM.length)]+EM[Math.floor(Math.random()*EM.length)];}while(used.indexOf(c)>-1);return c;}
function ensureCodes(){if(!D.codes)D.codes={};if(D.teacher===undefined)D.teacher=null;if(!D.canvas||D.canvas.join()==='Beginning,Intermediate,Proficient,Advanced')D.canvas=['BE','DE','ME','EE'];
 Object.keys(D.classes).forEach(function(cl){var m=D.codes[cl]=D.codes[cl]||{};
  D.classes[cl].forEach(function(n){if(!m[n])m[n]=newCode(cl);});
  Object.keys(m).forEach(function(n){if(D.classes[cl].indexOf(n)<0)delete m[n];});});save();}
ensureCodes();
var UI={tab:(location.hash||'#kiosk').slice(1),cls:CLASSES[0],who:'self',stu:null,step:0,ans:[],done:false,dstu:null,dmode:'student',msg:'',timer:null,sel:[],sOk:null,tOk:false,padMsg:'',asm:{mode:'practice',crit:'ru.pass'},ex:{mode:'latest',fmt:'canvas',ap:true},cmsg:''};
if(['kiosk','assess','export','dashboard','setup'].indexOf(UI.tab)<0)UI.tab='kiosk';

function names(){return (D.classes[UI.cls]||[]).slice().sort(function(a,b){return a.localeCompare(b);});}
function rat(cls,n,c,by){return D.ratings.filter(function(r){return r.cls===cls&&r.n===n&&r.c===c&&r.by===by;});}
function selfAvg(cls,n,c){var a=rat(cls,n,c,'self').sort(function(x,y){return x.d<y.d?-1:1;}).slice(-3);if(!a.length)return null;
 return Math.min(3,Math.floor(a.reduce(function(s,r){return s+r.b;},0)/a.length+.5));}
function tLatest(cls,n,c){var a=rat(cls,n,c,'teacher').sort(function(x,y){return (x.d<y.d?-1:(x.d>y.d?1:(x.r||0)-(y.r||0)));});return a.length?a[a.length-1].b:null;}
function addRating(r){D.ratings=D.ratings.filter(function(x){
 if(x.cls!==r.cls||x.n!==r.n||x.c!==r.c||x.by!==r.by)return true;
 return r.by==='asm'?(x.d!==r.d||x.p!==r.p):x.d!==r.d;});D.ratings.push(r);save();}
function focusCrits(){return CRITS.filter(function(c){return D.focus.indexOf(c.id)>-1;});}
function doneFor(n){var f=focusCrits();return f.length&&f.every(function(c){

function asmVal(cls,n,c,mode){var a=D.ratings.filter(function(r){return r.cls===cls&&r.n===n&&r.c===c&&r.by==='asm'&&(mode==='latest'||r.p===mode);});

 if(cur&&cur.b===b){D.ratings=D.ratings.filter(function(r){return r!==cur;});save();return;}

/* Google Sheet backup (Google Apps Script web app) */
function shText(){var m={wait:'Backup: connecting to your Google Sheet…',dirty:'Backup: changes waiting to save…',saving:'Backup: saving to your Google Sheet…',ok:'Saved to Google Sheet'+(SH.at?' at '+SH.at:'')+'.',err:'NOT backed up to the Google Sheet. '+SH.msg,off:'Backup is not set up yet. Go to Setup, Backup to Google Sheet.'};return m[SH.state]||'';}
function shStatus(st,msg){SH.state=st;SH.msg=msg||'';var c=document.getElementById('shChip');if(c){c.setAttribute('data-s',st);c.textContent=shText();}var m=document.getElementById('shMsg');if(m){m.setAttribute('data-s',st);m.innerHTML='<strong>'+esc(shText())+'</strong>';}}
function shErr(e){var c=e&&e.code,t=(e&&e.message)||'';var map={bad_token:'The backup password is wrong.',nonet:'Could not reach Google. Check the internet and the web app link.',timeout:'Google took too long. It will try again at the next change.',bad_response:'The link did not answer like the backup script. Check you copied the /exec link and deployed with access for Anyone.'};return map[c]||('Problem: '+(c||'unknown')+'. '+t.slice(0,100));}
function shNow(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function hasData(x){if(!x||x.demo)return false;var n=0;Object.keys(x.classes||{}).forEach(function(k){n+=(x.classes[k]||[]).length;});return n>0||(x.ratings||[]).length>0;}
function shSaveConf(){try{localStorage.setItem('g7ap.conn',JSON.stringify({u:SH.url,t:SH.tok}));}catch(e){}}
function shLink(){try{return location.href.split('#')[0]+'#c='+encodeURIComponent(btoa(SH.url+'|'+SH.tok));}catch(e){return '';}}
function shLoadConf(){var m=(location.hash||'').match(/[#&]c=([^&]+)/);if(m){try{var p=atob(decodeURIComponent(m[1])).split('|');SH.url=p[0];SH.tok=p.slice(1).join('|');shSaveConf();return;}catch(e){}}try{var c=JSON.parse(localStorage.getItem('g7ap.conn')||'null');if(c){SH.url=c.u||'';SH.tok=c.t||'';}}catch(e){}}
function shApi(body){body.t=SH.tok;var ac=(window.AbortController?new AbortController():null),to=setTimeout(function(){if(ac)ac.abort();},25000);
 return fetch(SH.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ac?ac.signal:undefined}).then(function(r){clearTimeout(to);return r.text();},function(e){clearTimeout(to);throw {code:(e&&e.name==='AbortError')?'timeout':'nonet',message:''};}).then(function(t){var j;try{j=JSON.parse(t);}catch(e){throw {code:'bad_response',message:''};}if(!j.ok)throw {code:j.error||'error',message:j.message||''};return j;});}
function shInit(){shLoadConf();if(!SH.url||!SH.tok){shStatus('off');return;}shPull(false);}
function shPull(force){if(!SH.url||!SH.tok||SH.pulling)return;SH.pulling=true;shStatus('wait');
 shApi({a:'get'}).then(function(r){SH.pulling=false;var remote=null;if(r.data){try{remote=JSON.parse(r.data);}catch(e){SH.pulled=false;shStatus('err','The data in the Sheet could not be read.');return;}}
  SH.pulled=true;var lh=hasData(D),rh=hasData(remote),took=false;
  if(rh&&(force||!lh||(remote.savedAt||0)>(D.savedAt||0))){SH.quiet=true;D=remote;if(!D.focus||!D.focus.length)D.focus=['effort','team'];ensureCodes();SH.quiet=false;took=true;if(CLASSES.indexOf(UI.cls)<0)UI.cls=CLASSES[0];}
  if(!took&&lh){shPush(false);}else{SH.at=shNow();shStatus('ok');}
  if(took){UI.msg='Loaded your data from the Google Sheet.';render();}else{render();}
 },function(e){SH.pulling=false;SH.pulled=false;shStatus('err',shErr(e));});}
function shSoon(){if(!SH.url||!SH.tok||D.demo)return;if(!SH.pulled){if(!SH.pulling)shPull(false);return;}clearTimeout(SH.timer);SH.timer=setTimeout(function(){shPush(false);},1500);if(SH.state!=='saving')shStatus('dirty');}
function critName(id){var n=id,a=(ASM.rugby.crits||[]).concat(typeof CRITS!=='undefined'?CRITS:[]);a.forEach(function(c){if(c.id===id)n=c.name;});return n;}
function shPush(manual){if(!SH.url||!SH.tok)return;if(!SH.pulled){shPull(false);return;}
 if(SH.busy){SH.again=true;return;}
 if(D.demo){if(manual)shStatus('err','These are example students. Add your real class lists first.');return;}
 SH.busy=true;shStatus('saving');
 var tab=[['Class','Student','Date','Who rated','Session','Criterion','Level']];
 (D.ratings||[]).slice().sort(function(a,b){return (a.cls+a.n).localeCompare(b.cls+b.n)||String(a.d).localeCompare(String(b.d));}).forEach(function(r){tab.push([r.cls,r.n,r.d||'',r.by==='asm'?'Teacher assessment':r.by==='self'?'Student':'Teacher',r.p||'',critName(r.c),r.b!==undefined?BANDS[r.b]:(r.r||'')]);});
 shApi({a:'put',d:JSON.stringify(D),rows:tab}).then(function(){SH.busy=false;SH.at=shNow();shStatus('ok');if(SH.again){SH.again=false;shSoon();}},function(e){SH.busy=false;SH.again=false;shStatus('err',shErr(e));});}
